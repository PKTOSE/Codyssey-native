<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Tier - 영화 티어리스트</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --border-color: #2b2b36;
      --text-color: #f0f0f2;
      --text-muted: #9e9ea7;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --tier-label-width: 100px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-title-input {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-color);
      font-size: 1.5rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      transition: border 0.2s;
    }

    .app-title-input:hover, .app-title-input:focus {
      background: #18181b;
      border-color: #3f3f46;
      outline: none;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      background-color: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s, border-color 0.15s;
    }

    button:hover {
      background-color: #3f3f46;
    }

    button.primary {
      background-color: var(--accent);
      border-color: var(--accent);
    }
    button.primary:hover {
      background-color: var(--accent-hover);
    }

    button.danger {
      background-color: var(--danger);
      border-color: var(--danger);
    }
    button.danger:hover {
      background-color: var(--danger-hover);
    }

    /* 티어 관리 바 */
    .tier-controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* 티어 보드 */
    .tier-board {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background-color: #09090b;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .tier-row {
      display: flex;
      min-height: 110px;
      background-color: #18181b;
      border-radius: 4px;
      overflow: hidden;
    }

    .tier-label-wrapper {
      width: var(--tier-label-width);
      min-width: var(--tier-label-width);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      padding: 6px;
      text-align: center;
      user-select: none;
    }

    .tier-name {
      color: #000;
      font-weight: 800;
      font-size: 1.3rem;
      word-break: break-all;
    }

    .tier-config-icon {
      font-size: 0.75rem;
      opacity: 0.6;
      color: #000;
      margin-top: 2px;
    }

    .tier-items {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
      padding: 10px;
      background-color: #1f1f23;
      transition: background-color 0.2s;
    }

    .tier-items.drag-over {
      background-color: #2d2d34;
    }

    /* 미분류 영역 */
    .unranked-section {
      background-color: #18181b;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .unranked-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .unranked-header h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .search-input {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent);
    }

    .unranked-items {
      min-height: 120px;
      background-color: #121214;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
      border: 1px dashed #3f3f46;
    }

    .unranked-items.drag-over {
      background-color: #1a1a20;
    }

    /* 영화 카드 */
    .movie-card {
      width: 76px;
      height: 100px;
      background-color: var(--card-bg);
      border-radius: 5px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: grab;
      border: 1px solid #3f3f46;
      user-select: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .movie-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border-color: #71717a;
    }

    .movie-card:active {
      cursor: grabbing;
    }

    .movie-card.dragging {
      opacity: 0.4;
    }

    .movie-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .movie-card .card-text-only {
      width: 100%;
      height: 100%;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #27272a, #18181b);
    }

    .card-text-only .movie-title {
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.2;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      word-break: break-all;
    }

    .card-text-only .movie-year {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .poster-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.85) 40%);
      padding: 10px 4px 4px 4px;
      color: #fff;
      font-size: 0.65rem;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #1e1e24;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.25rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group select {
      background: #121214;
      border: 1px solid #3f3f46;
      color: #fff;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    /* 친구 비교 뷰 전용 스타일 */
    .compare-modal-content {
      max-width: 820px;
    }

    .compare-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: #121214;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
    }

    .compare-stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .compare-stat-badge {
      background: #27272a;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      color: #a5b4fc;
    }

    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .compare-table th, .compare-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #27272a;
      text-align: left;
    }

    .compare-table th {
      background: #18181b;
      color: var(--text-muted);
      font-weight: 600;
    }

    .tier-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.8rem;
      color: #000;
      min-width: 24px;
      text-align: center;
    }

    .tier-badge.unranked {
      background: #3f3f46;
      color: #fff;
    }

    .tier-badge.none {
      background: transparent;
      color: var(--text-muted);
      font-weight: normal;
    }

    .diff-row {
      background-color: rgba(239, 68, 68, 0.08);
    }

    .diff-tag {
      color: #f87171;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 6px;
    }

    /* 모바일 반응형 */
    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      :root {
        --tier-label-width: 70px;
      }
      .tier-name {
        font-size: 1.1rem;
      }
      .movie-card {
        width: 64px;
        height: 86px;
      }
    }
  </style>
</head>
<body>

  <!-- 헤더 영역 -->
  <header>
    <div class="title-area">
      <input type="text" id="appTitle" class="app-title-input" value="내 영화 티어리스트" title="제목을 클릭해 수정할 수 있습니다" />
    </div>
    <div class="btn-group">
      <button class="primary" id="btnOpenAddMovie">+ 영화 추가</button>
      <button id="btnExportJson">JSON 저장</button>
      <button id="btnImportJson">JSON 불러오기</button>
      <button id="btnCompare">친구와 비교</button>
      <input type="file" id="fileInputImport" accept=".json,application/json" style="display:none;" />
      <input type="file" id="fileInputCompare" accept=".json,application/json" style="display:none;" />
    </div>
  </header>

  <!-- 티어 추가 바 -->
  <div class="tier-controls">
    <button id="btnAddTier" style="font-size: 0.8rem; padding: 6px 10px;">+ 새 티어 추가</button>
  </div>

  <!-- 티어리스트 보드 -->
  <main class="tier-board" id="tierBoard"></main>

  <!-- 미분류 영역 -->
  <section class="unranked-section">
    <div class="unranked-header">
      <h3>미분류 목록 (<span id="unrankedCount">0</span>)</h3>
      <input type="text" id="unrankedSearch" class="search-input" placeholder="영화 제목 검색..." />
    </div>
    <div class="unranked-items" id="unrankedContainer" data-tier-id="unranked"></div>
  </section>

  <!-- 1. 영화 등록/수정 모달 -->
  <div class="modal-overlay" id="movieModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="movieModalTitle">영화 추가</h2>
        <button class="modal-close" data-close="movieModal">&times;</button>
      </div>
      <form id="movieForm">
        <input type="hidden" id="movieId" />
        <div class="form-group">
          <label for="movieTitleInput">영화 제목 <span style="color:var(--danger)">*</span></label>
          <input type="text" id="movieTitleInput" placeholder="예: 인터스텔라" required />
          <div id="duplicateWarning" style="color:#fbbf24; font-size:0.75rem; display:none; margin-top:2px;">
            ⚠️ 이미 등록된 영화 제목과 연도입니다.
          </div>
        </div>
        <div class="form-group">
          <label for="movieYearInput">개봉 연도 (선택)</label>
          <input type="number" id="movieYearInput" placeholder="예: 2014" min="1880" max="2100" />
        </div>
        <div class="form-group">
          <label for="moviePosterInput">포스터 이미지 (선택, 자동 압축)</label>
          <input type="file" id="moviePosterInput" accept="image/png, image/jpeg, image/webp" />
          <div id="posterPreviewWrap" style="display:none; margin-top:8px;">
            <img id="posterPreview" style="max-height: 120px; border-radius: 4px; border: 1px solid #3f3f46;" />
            <button type="button" id="btnRemovePoster" style="margin-top:4px; font-size:0.75rem; padding:2px 8px;">이미지 삭제</button>
          </div>
        </div>
        <div class="form-group" id="quickTierMoveWrap" style="display:none;">
          <label for="quickTierSelect">현재 위치 / 티어 이동 (모바일 전용)</label>
          <select id="quickTierSelect"></select>
        </div>
        <div class="modal-actions">
          <button type="button" id="btnDeleteMovie" class="danger" style="display:none; margin-right:auto;">삭제</button>
          <button type="button" data-close="movieModal">취소</button>
          <button type="submit" class="primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. 티어 수정 모달 -->
  <div class="modal-overlay" id="tierModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>티어 설정</h2>
        <button class="modal-close" data-close="tierModal">&times;</button>
      </div>
      <form id="tierForm">
        <input type="hidden" id="tierIdInput" />
        <div class="form-group">
          <label for="tierNameInput">티어 이름</label>
          <input type="text" id="tierNameInput" required maxlength="10" />
        </div>
        <div class="form-group">
          <label for="tierColorInput">티어 배경 색상</label>
          <input type="color" id="tierColorInput" style="height:42px; width:100%; padding:2px; border-radius:6px; cursor:pointer;" />
        </div>
        <div class="modal-actions">
          <button type="button" id="btnDeleteTier" class="danger" style="margin-right:auto;">티어 삭제</button>
          <button type="button" data-close="tierModal">취소</button>
          <button type="submit" class="primary">변경사항 저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. 친구와 비교 모달 -->
  <div class="modal-overlay" id="compareModal">
    <div class="modal-content compare-modal-content">
      <div class="modal-header">
        <h2>친구와 평가 비교</h2>
        <button class="modal-close" data-close="compareModal">&times;</button>
      </div>
      <div class="compare-summary" id="compareSummary">
        <!-- 통계 표시 -->
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:0.88rem;">
          <input type="checkbox" id="diffOnlyCheckbox" />
          다르게 평가한 영화만 보기
        </label>
        <span id="compareCountLabel" style="font-size:0.8rem; color:var(--text-muted)"></span>
      </div>
      <div style="overflow-x:auto; max-height:480px;">
        <table class="compare-table">
          <thead>
            <tr>
              <th>영화 제목</th>
              <th>개봉</th>
              <th>내 티어</th>
              <th>친구 티어</th>
              <th>비고</th>
            </tr>
          </thead>
          <tbody id="compareTableBody"></tbody>
        </table>
      </div>
      <div class="modal-actions">
        <button type="button" data-close="compareModal">닫기</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       1. 애플리케이션 상태 (State) 및 기본 상수
       ========================================================= */
    const STORAGE_KEY = 'movie_tierlist_app_state_v1';

    const DEFAULT_DATA = {
      version: 1,
      title: "내 영화 티어리스트",
      tiers: [
        { id: "tier_s", name: "S", color: "#ff7f7f", movieIds: [] },
        { id: "tier_a", name: "A", color: "#ffbf7f", movieIds: [] },
        { id: "tier_b", name: "B", color: "#ffdf7f", movieIds: [] },
        { id: "tier_c", name: "C", color: "#bfff7f", movieIds: [] },
        { id: "tier_d", name: "D", color: "#8fdf9f", movieIds: [] }
      ],
      movies: [],
      unrankedMovieIds: []
    };

    let appState = loadState();
    let pendingPosterBase64 = null;
    let draggedMovieId = null;
    let cachedComparisonResult = null;

    /* =========================================================
       2. 초기화 및 로컬스토리지 제어
       ========================================================= */
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.tiers) && Array.isArray(parsed.movies)) {
            return parsed;
          }
        }
      } catch (e) {
        console.error("데이터 복원 실패:", e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn("용량 한도 초과 또는 LocalStorage 쓰기 실패:", e);
      }
    }

    /* =========================================================
       3. 렌더링 파이프라인
       ========================================================= */
    const appTitleInput = document.getElementById('appTitle');
    const tierBoard = document.getElementById('tierBoard');
    const unrankedContainer = document.getElementById('unrankedContainer');
    const unrankedCount = document.getElementById('unrankedCount');
    const unrankedSearch = document.getElementById('unrankedSearch');

    function renderAll() {
      appTitleInput.value = appState.title || "내 영화 티어리스트";
      renderTierBoard();
      renderUnranked();
    }

    function renderTierBoard() {
      tierBoard.innerHTML = '';
      appState.tiers.forEach(tier => {
        const row = document.createElement('div');
        row.className = 'tier-row';
        row.dataset.tierId = tier.id;

        // 티어 라벨 헤더
        const labelWrap = document.createElement('div');
        labelWrap.className = 'tier-label-wrapper';
        labelWrap.style.backgroundColor = tier.color;
        labelWrap.title = '클릭하여 티어 이름 및 색상 수정';
        labelWrap.innerHTML = `
          <div class="tier-name">${escapeHtml(tier.name)}</div>
          <div class="tier-config-icon">⚙️</div>
        `;
        labelWrap.addEventListener('click', () => openTierModal(tier.id));

        // 카드 수납 컨테이너
        const itemsWrap = document.createElement('div');
        itemsWrap.className = 'tier-items';
        itemsWrap.dataset.tierId = tier.id;
        setupDropZone(itemsWrap);

        (tier.movieIds || []).forEach(mId => {
          const movie = appState.movies.find(m => m.id === mId);
          if (movie) {
            itemsWrap.appendChild(createMovieCardElement(movie));
          }
        });

        row.appendChild(labelWrap);
        row.appendChild(itemsWrap);
        tierBoard.appendChild(row);
      });
    }

    function renderUnranked() {
      unrankedContainer.innerHTML = '';
      setupDropZone(unrankedContainer);

      const query = (unrankedSearch.value || '').trim().toLowerCase();
      let displayedCount = 0;

      (appState.unrankedMovieIds || []).forEach(mId => {
        const movie = appState.movies.find(m => m.id === mId);
        if (!movie) return;

        if (query && !movie.title.toLowerCase().includes(query)) {
          return;
        }

        unrankedContainer.appendChild(createMovieCardElement(movie));
        displayedCount++;
      });

      unrankedCount.textContent = (appState.unrankedMovieIds || []).length;
    }

    function createMovieCardElement(movie) {
      const card = document.createElement('div');
      card.className = 'movie-card';
      card.draggable = true;
      card.dataset.movieId = movie.id;
      card.title = `${movie.title}${movie.year ? ` (${movie.year})` : ''} - 클릭하여 수정/이동`;

      if (movie.poster) {
        card.innerHTML = `
          <img src="${movie.poster}" alt="${escapeHtml(movie.title)}" loading="lazy">
          <div class="poster-caption">${escapeHtml(movie.title)}</div>
        `;
      } else {
        card.innerHTML = `
          <div class="card-text-only">
            <div class="movie-title">${escapeHtml(movie.title)}</div>
            ${movie.year ? `<div class="movie-year">${movie.year}</div>` : ''}
          </div>
        `;
      }

      // 카드 클릭 시 모달 열기 (터치/모바일 환경 포함)
      card.addEventListener('click', (e) => {
        if (card.classList.contains('dragging')) return;
        openMovieEditModal(movie.id);
      });

      // 드래그 이벤트 등록
      card.addEventListener('dragstart', (e) => {
        draggedMovieId = movie.id;
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', movie.id);
        e.dataTransfer.effectAllowed = 'move';
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        draggedMovieId = null;
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      });

      return card;
    }

    /* =========================================================
       4. 드래그 앤 드롭 정렬 / 티어 간 이동 구현
       ========================================================= */
    function setupDropZone(container) {
      container.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        container.classList.add('drag-over');

        const afterElement = getDragAfterElement(container, e.clientX, e.clientY);
        const draggingElement = document.querySelector('.dragging');
        if (draggingElement) {
          if (afterElement == null) {
            container.appendChild(draggingElement);
          } else {
            container.insertBefore(draggingElement, afterElement);
          }
        }
      });

      container.addEventListener('dragleave', (e) => {
        if (!container.contains(e.relatedTarget)) {
          container.classList.remove('drag-over');
        }
      });

      container.addEventListener('drop', (e) => {
        e.preventDefault();
        container.classList.remove('drag-over');
        const targetTierId = container.dataset.tierId;
        syncContainerOrderToState(container, targetTierId);
      });
    }

    function getDragAfterElement(container, x, y) {
      const draggableElements = [...container.querySelectorAll('.movie-card:not(.dragging)')];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offsetX = x - box.left - box.width / 2;
        const offsetY = y - box.top - box.height / 2;
        const distance = Math.hypot(offsetX, offsetY);

        if (distance < closest.distance) {
          return { distance: distance, element: child };
        } else {
          return closest;
        }
      }, { distance: Number.POSITIVE_INFINITY }).element;
    }

    function syncContainerOrderToState(container, targetTierId) {
      const orderedIds = [...container.querySelectorAll('.movie-card')].map(c => c.dataset.movieId);

      // 전체 상태에서 기존 배치 제거
      appState.tiers.forEach(t => {
        t.movieIds = t.movieIds.filter(id => !orderedIds.includes(id));
      });
      appState.unrankedMovieIds = appState.unrankedMovieIds.filter(id => !orderedIds.includes(id));

      // 새 위치에 할당
      if (targetTierId === 'unranked') {
        appState.unrankedMovieIds = orderedIds;
      } else {
        const tier = appState.tiers.find(t => t.id === targetTierId);
        if (tier) {
          tier.movieIds = orderedIds;
        }
      }

      saveState();
      renderAll();
    }

    // 중복 검사 리스너
    function checkDuplicate() {
      const title = movieTitleInput.value.trim().toLowerCase();
      const year = movieYearInput.value ? parseInt(movieYearInput.value, 10) : null;
      const currentId = movieIdInput.value;

      if (!title) {
        duplicateWarning.style.display = 'none';
        return;
      }

      const dup = appState.movies.some(m => {
        if (m.id === currentId) return false;
        if (m.title.trim().toLowerCase() !== title) return false;
        if (year && m.year && year !== m.year) return false;
        return true;
      });

      duplicateWarning.style.display = dup ? 'block' : 'none';
    }

    movieTitleInput.addEventListener('input', checkDuplicate);
    movieYearInput.addEventListener('input', checkDuplicate);

    // 포스터 이미지 압축 처리 (Canvas)
    moviePosterInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 320;
          let w = img.width;
          let h = img.height;

          if (w > h && w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else if (h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }

          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          pendingPosterBase64 = canvas.toDataURL('image/jpeg', 0.82);
          posterPreview.src = pendingPosterBase64;
          posterPreviewWrap.style.display = 'block';
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

      const mId = movieIdInput.value;

      if (mId) {
        // 기존 영화 수정

        if (movie) {
          movie.title = title;
          movie.year = year;

          // 위치 변경 확인 (모바일 대응)

          if (targetTierId !== currentTierId) {
            removeMovieFromTiers(mId);
            if (targetTierId === 'unranked') {
              appState.unrankedMovieIds.unshift(mId);
            } else {
              const destTier = appState.tiers.find(t => t.id === targetTierId);
              if (destTier) destTier.movieIds.unshift(mId);
            }
          }
        }
      } else {
        // 신규 영화 추가 -> 미분류로
        const newId = 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        const newMovie = {
          id: newId,
          title: title,
          year: year,
          poster: pendingPosterBase64
        };

    document.getElementById('btnAddTier').addEventListener('click', () => {

    /* =========================================================
       7. JSON 내보내기 & 불러오기

    document.getElementById('btnExportJson').addEventListener('click', () => {

    const fileInputImport = document.getElementById('fileInputImport');

    /* =========================================================
       8. 친구와 비교 분석 로직

    const fileInputCompare = document.getElementById('fileInputCompare');
    const compareModal = document.getElementById('compareModal');
    const compareSummary = document.getElementById('compareSummary');
    const compareTableBody = document.getElementById('compareTableBody');
    const diffOnlyCheckbox = document.getElementById('diffOnlyCheckbox');
    const compareCountLabel = document.getElementById('compareCountLabel');

    document.getElementById('btnCompare').addEventListener('click', () => {
      fileInputCompare.value = '';
      fileInputCompare.click();
    });

    fileInputCompare.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const friendData = JSON.parse(event.target.result);
          if (!friendData || !Array.isArray(friendData.tiers) || !Array.isArray(friendData.movies)) {
            throw new Error("유효한 티어리스트 JSON 형식이 아닙니다.");
          }
          performComparison(friendData);
          openModal('compareModal');
        } catch (err) {
          alert("비교 파일을 읽을 수 없습니다:\n" + err.message);
        }
      };
      reader.readAsText(file, "UTF-8");

    function getTierInfoFromData(data, movieId) {
      for (const t of data.tiers) {
        if ((t.movieIds || []).includes(movieId)) {
          return { name: t.name, color: t.color, isRanked: true };
        }
      }
      if ((data.unrankedMovieIds || []).includes(movieId)) {
        return { name: '미분류', color: '#52525b', isRanked: false };
      }
      return { name: '-', color: 'transparent', isRanked: false, isAbsent: true };
    }

    function performComparison(friendData) {
      const myMovies = appState.movies;
      const friendMovies = friendData.movies;

      const myMatched = new Set();
      const friendMatched = new Set();
      const comparisonRows = [];

      // 1. 제목 + 연도 완전 일치 매칭
      myMovies.forEach(m1 => {
        const found = friendMovies.find(m2 => {
          if (friendMatched.has(m2.id)) return false;
          if (m1.title.trim().toLowerCase() === m2.title.trim().toLowerCase()) {
            if (m1.year && m2.year) return m1.year === m2.year;
            return false;
          }
          return false;
        });

        if (found) {
          myMatched.add(m1.id);
          friendMatched.add(found.id);
          comparisonRows.push({
            title: m1.title,
            year: m1.year || found.year || null,
            myTier: getTierInfoFromData(appState, m1.id),
            friendTier: getTierInfoFromData(friendData, found.id),
            status: 'both'
          });
        }
      });

      // 2. 한쪽에 연도가 없는 경우 유일한 제목일 때만 매칭
      myMovies.forEach(m1 => {
        if (myMatched.has(m1.id)) return;

        const candidateFriends = friendMovies.filter(m2 => 
          !friendMatched.has(m2.id) &&
          m1.title.trim().toLowerCase() === m2.title.trim().toLowerCase()
        );

        if (candidateFriends.length === 1) {
          const found = candidateFriends[0];
          myMatched.add(m1.id);
          friendMatched.add(found.id);
          comparisonRows.push({
            title: m1.title,
            year: m1.year || found.year || null,
            myTier: getTierInfoFromData(appState, m1.id),
            friendTier: getTierInfoFromData(friendData, found.id),
            status: 'both'
          });
        }
      });

      // 3. 나에게만 있는 영화
      myMovies.forEach(m1 => {
        if (!myMatched.has(m1.id)) {
          comparisonRows.push({
            title: m1.title,
            year: m1.year,
            myTier: getTierInfoFromData(appState, m1.id),
            friendTier: { name: '없음', color: 'transparent', isRanked: false, isAbsent: true },
            status: 'only_me'
          });
        }
      });

      // 4. 친구에게만 있는 영화
      friendMovies.forEach(m2 => {
        if (!friendMatched.has(m2.id)) {
          comparisonRows.push({
            title: m2.title,
            year: m2.year,
            myTier: { name: '없음', color: 'transparent', isRanked: false, isAbsent: true },
            friendTier: getTierInfoFromData(friendData, m2.id),
            status: 'only_friend'
          });
        }
      });

      // 차이 여부 판별
      comparisonRows.forEach(row => {
        row.isDiff = (row.myTier.name !== row.friendTier.name);
      });

      cachedComparisonResult = comparisonRows;
      renderComparisonView();
    }

    function renderComparisonView() {
      if (!cachedComparisonResult) return;

      const diffOnly = diffOnlyCheckbox.checked;
      const rows = cachedComparisonResult;

      const commonRows = rows.filter(r => r.status === 'both');
      const diffCount = commonRows.filter(r => r.isDiff).length;
      const onlyMeCount = rows.filter(r => r.status === 'only_me').length;
      const onlyFriendCount = rows.filter(r => r.status === 'only_friend').length;

      compareSummary.innerHTML = `
        <div class="compare-stat-item">공통 영화: <span class="compare-stat-badge">${commonRows.length}편</span></div>
        <div class="compare-stat-item">평가 불일치: <span class="compare-stat-badge" style="color:#f87171;">${diffCount}편</span></div>
        <div class="compare-stat-item">나에게만 있음: <span class="compare-stat-badge">${onlyMeCount}편</span></div>
        <div class="compare-stat-item">친구에게만 있음: <span class="compare-stat-badge">${onlyFriendCount}편</span></div>
      `;

      compareTableBody.innerHTML = '';
      let visibleCount = 0;

      rows.forEach(r => {
        if (diffOnly && !r.isDiff) return;

        const tr = document.createElement('tr');
        if (r.status === 'both' && r.isDiff) {
          tr.className = 'diff-row';
        }

        const myBadge = r.myTier.isAbsent 
          ? `<span class="tier-badge none">-</span>`
          : `<span class="tier-badge ${r.myTier.isRanked ? '' : 'unranked'}" style="background-color:${r.myTier.color}">${escapeHtml(r.myTier.name)}</span>`;

        const friendBadge = r.friendTier.isAbsent
          ? `<span class="tier-badge none">-</span>`
          : `<span class="tier-badge ${r.friendTier.isRanked ? '' : 'unranked'}" style="background-color:${r.friendTier.color}">${escapeHtml(r.friendTier.name)}</span>`;

        let remark = '';
        if (r.status === 'both') {
          remark = r.isDiff ? `<span class="diff-tag">평가 차이</span>` : `<span style="color:#4ade80; font-size:0.75rem;">일치</span>`;
        } else if (r.status === 'only_me') {
          remark = `<span style="color:var(--text-muted); font-size:0.75rem;">나만 평가</span>`;
        } else if (r.status === 'only_friend') {
          remark = `<span style="color:var(--text-muted); font-size:0.75rem;">친구만 평가</span>`;
        }

        tr.innerHTML = `
          <td><strong>${escapeHtml(r.title)}</strong></td>
          <td style="color:var(--text-muted); font-size:0.8rem;">${r.year || '-'}</td>
          <td>${myBadge}</td>
          <td>${friendBadge}</td>
          <td>${remark}</td>
        `;

        compareTableBody.appendChild(tr);
        visibleCount++;
      });

      compareCountLabel.textContent = `총 ${visibleCount}개 항목 표시 중`;
    }

    diffOnlyCheckbox.addEventListener('change', renderComparisonView);

    /* =========================================================
       9. 모달 관리 & 유틸리티
       ========================================================= */
    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');

      });
    });

    window.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        e.target.classList.remove('active');
      }
    });

    appTitleInput.addEventListener('change', () => {
      appState.title = appTitleInput.value.trim() || "내 영화 티어리스트";
      saveState();
    });

    document.getElementById('btnOpenAddMovie').addEventListener('click', openMovieAddModal);
    unrankedSearch.addEventListener('input', renderUnranked);

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 초기 시작
    renderAll();
  </script>
</body>
</html>
